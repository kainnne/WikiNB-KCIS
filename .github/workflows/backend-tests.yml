name: KCIS backend tests

on:
  push:
    branches: [main]
    paths:
      - 'auth/**'
      - 'cloud-api/**'
      - 'src/lib/**'
      - '.github/workflows/backend-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
        working-directory: auth
      - run: npm test
        working-directory: auth
      - run: npm test
        working-directory: cloud-api
